# HU-WEB-033: Adhesión Código de Buenas Prácticas IA 2026 CCS TheIA
title: TheIA Blog
description: "IA conversacional para ventas: guias, casos de uso y tendencias para PYMEs en Chile."
url: "https://theia.cl"
baseurl: ""

permalink: /blog/:title/

plugins:
  - jekyll-feed

include:
  - robots.txt
  - llms.txt
  - sitemap.xml

exclude:
  - CHANGELOG.md
  - CLAUDE.md
  - skills-lock.json
  - .claude
  - .agents
  - .DS_Store

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
